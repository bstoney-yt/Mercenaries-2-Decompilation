<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>m2 glTF viewer</title>
<style>
  :root { color-scheme: dark; --bg: #1b1d22; --panel: #262a31; --text: #e6e6e6; --muted: #9aa0aa; --accent: #6aa9ff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px system-ui, sans-serif; }
  #view { position: fixed; inset: 0; }
  #panel { position: fixed; top: 12px; left: 12px; width: 320px; max-height: calc(100% - 24px); overflow: auto;
           background: var(--panel); border-radius: 8px; padding: 12px; box-shadow: 0 4px 16px #0006; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  label { display: block; color: var(--muted); margin: 10px 0 4px; }
  select, input[type=range] { width: 100%; }
  select { background: var(--bg); color: var(--text); border: 1px solid #444; border-radius: 4px; padding: 4px; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  button { background: var(--accent); color: #000; border: 0; border-radius: 4px; padding: 6px 10px; cursor: pointer; }
  #status { color: var(--muted); margin-top: 10px; white-space: pre-wrap; }
  #hint { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #000a; color: #fff;
          padding: 6px 12px; border-radius: 6px; pointer-events: none; }
  #hint:empty { display: none; }
  #drop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
          background: #000a; font-size: 20px; pointer-events: none; }
</style>
</head>
<body>
<div id="view"></div>
<div id="panel">
  <h1>m2 glTF viewer</h1>
  <div id="name"></div>
  <label for="anim">Animation</label>
  <select id="anim"></select>
  <div class="row">
    <button id="play">Pause</button>
    <button id="prev">◀</button>
    <button id="next">▶</button>
    <label style="margin:0"><input type="checkbox" id="skel"> skeleton</label>
  </div>
  <label for="speed">Speed <span id="speedv">1.0</span>x</label>
  <input type="range" id="speed" min="0.1" max="2" step="0.1" value="1">
  <label for="time">Time <span id="timev"></span></label>
  <input type="range" id="time" min="0" max="1" step="0.001" value="0">
  <div id="status">Loading…</div>
  <div id="playpanel" style="display:none">
    <h1 style="margin-top:14px">Play</h1>
    <label style="color:var(--text)"><input type="checkbox" id="playmode"> Play mode</label>
    <div style="color:var(--muted)">WASD to move (relative to the camera), Shift to sprint, Q to walk or run, E to get in or out of a vehicle. Drag to orbit.</div>
    <label style="color:var(--text)"><input type="checkbox" id="showcol"> show collision shapes (PHY2)</label>
    <label for="idle">Idle</label><select id="idle"></select>
    <label for="walk">Walk</label><select id="walk"></select>
    <label for="run">Run</label><select id="run"></select>
    <label for="sprint">Sprint</label><select id="sprint"></select>
  </div>
  <div style="color:var(--muted);margin-top:8px">Drag a .glb onto the page to open another.</div>
</div>
<div id="drop">Drop a .glb to open it</div>
<div id="hint"></div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
view.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x30343c);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(3, 6, 4);
scene.add(sun);
const grid = new THREE.GridHelper(20, 20, 0x666666, 0x444444);
scene.add(grid);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 5000);
camera.position.set(2, 1.6, 3);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);

const ui = id => document.getElementById(id);
const status = msg => ui('status').textContent = msg;
const clock = new THREE.Clock();
let mixer = null, action = null, clips = [], root = null, skeleton = null, playing = true, speed = 1;

function frame(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3()).length() || 1;
  const centre = box.getCenter(new THREE.Vector3());
  controls.target.copy(centre);
  camera.position.copy(centre).add(new THREE.Vector3(0.6, 0.35, 1).multiplyScalar(size));
  // With a world loaded, keep the far plane out at the horizon.
  camera.near = world ? 0.5 : size / 1000; camera.far = world ? 30000 : size * 100; camera.updateProjectionMatrix();
  grid.position.y = box.min.y;
}

let rest = [];
function play(i) {
  if (!mixer) return;
  mixer.stopAllAction();
  if (i < 0 || !clips[i]) {
    // The model's own node transforms, before any clip.
    for (const [o, p, q, s] of rest) { o.position.copy(p); o.quaternion.copy(q); o.scale.copy(s); }
    action = null;
    ui('anim').value = -1;
    return;
  }
  action = mixer.clipAction(clips[i]);
  action.reset().play();
  action.paused = !playing;
  ui('anim').value = i;
  ui('time').max = clips[i].duration || 1;
}

// ---- Play mode -------------------------------------------------------
// Locomotion clips carry their motion on the root node's translation and
// are otherwise loops, so each clip's speed and direction are measured from
// the root track. In play mode the root's horizontal motion is removed and
// the page moves the character at the clip's speed instead.
const player = new THREE.Group();
scene.add(player);
const keys = new Set();
const gears = ['idle', 'walk', 'run', 'sprint'];
const bands = { walk: [0.9, 1.9], run: [4.5, 5.6], sprint: [5.6, 7.5] };
let loco = null; // { fwd: Vector2, info: [{speed, dir, hips, still}], inPlace: Map }
let gear = null, current = null, walking = false;

function analyse(gltf) {
  const json = gltf.parser.json;
  const rootName = json.nodes[0]?.name;
  // The pelvis: the root's child that sits highest in the rest pose.
  const rootNode = root.getObjectByName(rootName);
  if (!rootNode) return null;
  root.updateMatrixWorld(true);
  let pelvis = null, best = -1;
  for (const c of rootNode.children) {
    const y = c.getWorldPosition(new THREE.Vector3()).y;
    if (y > best) { best = y; pelvis = c; }
  }
  const info = clips.map(c => {
    const t = c.tracks.find(t => t.name === `${rootName}.position`);
    const p = pelvis && c.tracks.find(t => t.name === `${pelvis.name}.position`);
    if (!t || c.duration <= 0) return null;
    const v = t.values, n = v.length;
    const d = new THREE.Vector2(v[n - 3] - v[0], v[n - 1] - v[2]);
    return {
      speed: d.length() / c.duration,
      dir: d.lengthSq() > 0 ? d.normalize() : new THREE.Vector2(),
      hips: p ? p.values[1] : 1,
      still: d.length() < 1e-3,
    };
  });
  return { rootName, info, inPlace: new Map() };
}

// A copy of clip `i` whose root keeps its first horizontal position.
function inPlace(i) {
  if (!loco.inPlace.has(i)) {
    const c = clips[i].clone();
    const t = c.tracks.find(t => t.name === `${loco.rootName}.position`);
    if (t) {
      const v = t.values;
      for (let k = 0; k < v.length; k += 3) { v[k] = v[0]; v[k + 2] = v[2]; }
    }
    loco.inPlace.set(i, c);
  }
  return loco.inPlace.get(i);
}

function fillGears() {
  // Character forward is the direction of the fastest forward runs.
  const movers = loco.info.map((x, i) => [x, i]).filter(([x]) => x && x.speed > 4);
  if (!movers.length) return false;
  const f = new THREE.Vector2();
  movers.forEach(([x]) => f.add(x.dir));
  loco.fwd = f.normalize();
  const forward = ([x]) => x && !x.still && x.dir.dot(loco.fwd) > 0.95 && x.hips > 0.85;
  const lists = {
    idle: loco.info.map((x, i) => [x, i]).filter(([x, i]) => x && x.still && x.hips > 0.95 && x.hips < 1.15
      && clips[i].duration >= 1.3).sort((a, b) => clips[b[1]].duration - clips[a[1]].duration),
  };
  for (const g of ['walk', 'run', 'sprint']) {
    lists[g] = loco.info.map((x, i) => [x, i]).filter(x => forward(x) && x[0].speed >= bands[g][0] && x[0].speed < bands[g][1]);
  }
  for (const g of gears) {
    const sel = ui(g);
    sel.innerHTML = '';
    for (const [x, i] of lists[g]) sel.add(new Option(`${clips[i].name.split(' ').pop()}  ${x.speed.toFixed(1)} m/s`, i));
    if (!lists[g].length) return false;
  }
  return true;
}

function setGear(g) {
  if (g === gear) return;
  gear = g;
  const next = mixer.clipAction(inPlace(+ui(g).value));
  next.reset().play();
  if (current && current !== next) current.crossFadeTo(next, 0.25, false);
  current = next;
}

// ---- World -----------------------------------------------------------
// An optional world.glb (from `gltf world`) loads beside the model. Its
// terrain pieces are bucketed by 100 m square so the ground under the
// character can be found with a short downward ray each frame.
let world = null;
// The sea surface, read from the world's sea mesh.
let seaLevel = 0;
const buckets = new Map();
const BUCKET = 100;
const ray = new THREE.Raycaster();
const down = new THREE.Vector3(0, -1, 0);
// Placed objects, shown only within this distance (?view=metres).
const objects = [];
// Vegetation runs, shown only within this distance (?veg=metres).
const plants = [];
const VEG_VIEW = +(new URLSearchParams(location.search).get('veg') || 150);
const VIEW = +(new URLSearchParams(location.search).get('view') || 1500);
let lastCull = 0;
function cullObjects(force) {
  const now = performance.now();
  if (!force && now - lastCull < 500) return;
  lastCull = now;
  const c = controls.target;
  for (const o of objects) o.visible = Math.hypot(o.position.x - c.x, o.position.z - c.z) < VIEW;
  for (const o of plants) o.visible = Math.hypot(o.position.x - c.x, o.position.z - c.z) < VEG_VIEW;
}

// ---- Collision -------------------------------------------------------
// Each placed object collides through its "col_" child (the model's PHY2
// shapes) or, where the model has none, through its own render triangles:
// a fallback, labelled as such in the status line. An object's triangles
// are gathered, in world space, into a grid of 4 m squares when the
// character first comes near it.
const colliders = []; // { obj, box, source: 'phy2' | 'render', loaded }
const CELL = 4;
const triGrid = new Map(); // "x,z" -> [{ t: Float32Array(9), id }]
let triCount = 0, stamp = 0;
const STEP = 0.5, RADIUS = 0.35, MAX_SLOPE = 50 * Math.PI / 180;
const showCollision = () => ui('showcol').checked;

function addCollider(o) {
  const col = o.children.find(c => c.name.startsWith('col_'));
  const box = new THREE.Box3().setFromObject(col || o);
  if (col) col.traverse(m => { if (m.isMesh) m.visible = showCollision(); });
  colliders.push({ obj: o, src: col || o, box, source: col ? 'phy2' : 'render', loaded: false });
}

function loadCollider(c) {
  c.loaded = true;
  const v = new THREE.Vector3();
  c.src.updateMatrixWorld(true);
  c.src.traverse(m => {
    if (!m.isMesh || m.isInstancedMesh) return;
    // Render fallback: only the object's own meshes, not its collision child.
    if (c.source === 'render' && m.name.startsWith('col_')) return;
    const pos = m.geometry.attributes.position, idx = m.geometry.index;
    const n = idx ? idx.count : pos.count;
    for (let i = 0; i + 2 < n; i += 3) {
      const t = new Float32Array(9);
      for (let k = 0; k < 3; k++) {
        v.fromBufferAttribute(pos, idx ? idx.getX(i + k) : i + k).applyMatrix4(m.matrixWorld);
        t[3 * k] = v.x; t[3 * k + 1] = v.y; t[3 * k + 2] = v.z;
      }
      const entry = { t, id: 0 };
      const x0 = Math.floor(Math.min(t[0], t[3], t[6]) / CELL), x1 = Math.floor(Math.max(t[0], t[3], t[6]) / CELL);
      const z0 = Math.floor(Math.min(t[2], t[5], t[8]) / CELL), z1 = Math.floor(Math.max(t[2], t[5], t[8]) / CELL);
      for (let x = x0; x <= x1; x++) for (let z = z0; z <= z1; z++) {
        const k = `${x},${z}`;
        if (!triGrid.has(k)) triGrid.set(k, []);
        triGrid.get(k).push(entry);
      }
      triCount++;
    }
  });
}

// Loads the colliders within 40 m of (x, z).
function loadNear(x, z) {
  for (const c of colliders) {
    if (c.loaded) continue;
    const b = c.box;
    if (x > b.min.x - 40 && x < b.max.x + 40 && z > b.min.z - 40 && z < b.max.z + 40) loadCollider(c);
  }
}

// Triangles in the grid squares within r of (x, z), each once.
function trisNear(x, z, r) {
  const out = [];
  stamp++;
  for (let gx = Math.floor((x - r) / CELL); gx <= Math.floor((x + r) / CELL); gx++)
    for (let gz = Math.floor((z - r) / CELL); gz <= Math.floor((z + r) / CELL); gz++)
      for (const e of triGrid.get(`${gx},${gz}`) || []) if (e.id !== stamp) { e.id = stamp; out.push(e.t); }
  return out;
}

// The highest collider surface under (x, z) at or below y, or -Infinity.
function colliderFloor(x, z, y) {
  let best = -Infinity;
  for (const t of trisNear(x, z, 0)) {
    const [ax, ay, az, bx, by, bz, cx, cy, cz] = t;
    const d = (bz - cz) * (ax - cx) + (cx - bx) * (az - cz);
    if (Math.abs(d) < 1e-9) continue;
    const l1 = ((bz - cz) * (x - cx) + (cx - bx) * (z - cz)) / d;
    const l2 = ((cz - az) * (x - cx) + (ax - cx) * (z - cz)) / d;
    const l3 = 1 - l1 - l2;
    if (l1 < 0 || l2 < 0 || l3 < 0) continue;
    const h = l1 * ay + l2 * by + l3 * cy;
    if (h <= y && h > best) best = h;
  }
  return best;
}

// Closest point on triangle t to p (Ericson, Real-Time Collision Detection 5.1.5).
const _a = new THREE.Vector3(), _b = new THREE.Vector3(), _c = new THREE.Vector3();
const _ab = new THREE.Vector3(), _ac = new THREE.Vector3(), _ap = new THREE.Vector3(), _q = new THREE.Vector3();
function closest(p, t) {
  _a.set(t[0], t[1], t[2]); _b.set(t[3], t[4], t[5]); _c.set(t[6], t[7], t[8]);
  _ab.subVectors(_b, _a); _ac.subVectors(_c, _a); _ap.subVectors(p, _a);
  const d1 = _ab.dot(_ap), d2 = _ac.dot(_ap);
  if (d1 <= 0 && d2 <= 0) return _q.copy(_a);
  const bp = _ap.clone().sub(_ab), d3 = _ab.dot(bp), d4 = _ac.dot(bp);
  if (d3 >= 0 && d4 <= d3) return _q.copy(_b);
  const vc = d1 * d4 - d3 * d2;
  if (vc <= 0 && d1 >= 0 && d3 <= 0) return _q.copy(_a).addScaledVector(_ab, d1 / (d1 - d3));
  const cp = _ap.clone().sub(_ac), d5 = _ab.dot(cp), d6 = _ac.dot(cp);
  if (d6 >= 0 && d5 <= d6) return _q.copy(_c);
  const vb = d5 * d2 - d1 * d6;
  if (vb <= 0 && d2 >= 0 && d6 <= 0) return _q.copy(_a).addScaledVector(_ac, d2 / (d2 - d6));
  const va = d3 * d6 - d5 * d4;
  if (va <= 0 && d4 - d3 >= 0 && d5 - d6 >= 0)
    return _q.copy(_b).addScaledVector(_c.clone().sub(_b), (d4 - d3) / ((d4 - d3) + (d5 - d6)));
  const denom = 1 / (va + vb + vc);
  return _q.copy(_a).addScaledVector(_ab, vb * denom).addScaledVector(_ac, vc * denom);
}

// Pushes a body (three spheres above the step height) out of walls,
// horizontally, so it slides along them. Moves `pos` in place.
const _p = new THREE.Vector3();
function pushOut(pos, radius = RADIUS, heights = [STEP + RADIUS, 1.2, 1.6]) {
  const tris = trisNear(pos.x, pos.z, radius + 0.1);
  if (!tris.length) return;
  for (let iter = 0; iter < 3; iter++) {
    let moved = false;
    for (const h of heights) {
      _p.set(pos.x, pos.y + h, pos.z);
      for (const t of tris) {
        const q = closest(_p, t);
        const dx = _p.x - q.x, dz = _p.z - q.z, dy = _p.y - q.y;
        const dist = Math.hypot(dx, dy, dz);
        if (dist >= radius) continue;
        const flat = Math.hypot(dx, dz);
        if (flat < 1e-4) continue; // straight above or below: floor or ceiling
        const push = (radius - dist) * (dist / flat) + 1e-3;
        pos.x += dx / flat * push; pos.z += dz / flat * push;
        _p.x = pos.x; _p.z = pos.z;
        moved = true;
      }
    }
    if (!moved) break;
  }
}

function openWorld(gltf) {
  world = gltf.scene;
  scene.add(world);
  world.updateMatrixWorld(true);
  world.traverse(o => {
    if (o.name.startsWith('obj_')) { objects.push(o); addCollider(o); return; }
    if (o.name.startsWith('veg_')) { plants.push(o); return; }
    if (o.name.startsWith('veh_')) { addVehicle(o); return; }
    if (o.isMesh && (o.name === 'sea' || o.parent?.name === 'sea')) seaLevel = new THREE.Box3().setFromObject(o).max.y;
    if (!o.isMesh || o.name === 'sea' || o.parent?.name === 'sea') return;
    // Placed objects are not ground (yet): only terrain is walked on.
    for (let p = o; p; p = p.parent) if (/^(obj|veg|veh)_/.test(p.name)) return;
    const b = new THREE.Box3().setFromObject(o);
    for (let x = Math.floor(b.min.x / BUCKET); x <= Math.floor(b.max.x / BUCKET); x++)
      for (let z = Math.floor(b.min.z / BUCKET); z <= Math.floor(b.max.z / BUCKET); z++) {
        const k = `${x},${z}`;
        if (!buckets.has(k)) buckets.set(k, []);
        buckets.get(k).push(o);
      }
  });
  grid.visible = false;
  cullObjects(true);
  scene.background = new THREE.Color(0x9cc3dc);
  scene.fog = new THREE.Fog(0x9cc3dc, 800, 7000);
  camera.near = 0.5; camera.far = 30000; camera.updateProjectionMatrix();
  sun.position.set(2000, 3000, 1000);
  const phy2 = colliders.filter(c => c.source === 'phy2').length;
  status(ui('status').textContent + ` · world loaded (Play mode starts you on the island) · collision: ${phy2} objects with PHY2 shapes, ${colliders.length - phy2} using render triangles (fallback)`);
}

/// Terrain under (x, z): { y, normal }, or the sea.
const _up = new THREE.Vector3(0, 1, 0);
function terrainAt(x, z) {
  const near = buckets.get(`${Math.floor(x / BUCKET)},${Math.floor(z / BUCKET)}`);
  if (!near) return { y: seaLevel, normal: _up };
  ray.set(new THREE.Vector3(x, 5000, z), down);
  const hit = ray.intersectObjects(near, false)[0];
  if (!hit || hit.point.y < seaLevel) return { y: seaLevel, normal: _up };
  const normal = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
  if (normal.y < 0) normal.negate();
  return { y: hit.point.y, normal };
}

/// Ground height under (x, z), or sea level.
function groundAt(x, z) {
  return terrainAt(x, z).y;
}

/// The surface a character with feet at y stands on at (x, z): the terrain
/// or a collider no more than a step above the feet.
function floorAt(x, z, y) {
  const t = terrainAt(x, z);
  const c = colliderFloor(x, z, y + STEP);
  return c > t.y ? { y: c, normal: _up, onObject: true } : t;
}

/// Puts the camera behind and above the character.
function follow() {
  const back = new THREE.Vector3(0, 0, 1).applyQuaternion(player.quaternion).multiplyScalar(5);
  controls.target.copy(player.position).add(new THREE.Vector3(0, 1.4, 0));
  camera.position.copy(controls.target).add(back).add(new THREE.Vector3(0, 1.6, 0));
}

function startPlay(on) {
  mixer.stopAllAction();
  driving = null;
  ride = null;
  player.visible = true;
  ui('hint').textContent = '';
  action = null; current = null; gear = null;
  player.rotation.set(0, 0, 0);
  if (world && on) {
    // ?spawn=x,z in game coordinates (the export mirrors z).
    const [sx, sz] = (new URLSearchParams(location.search).get('spawn') || '0,0').split(',').map(Number);
    player.position.set(sx, 0, -sz);
    loadNear(player.position.x, player.position.z);
    // Start on top of whatever is there.
    player.position.y = floorAt(player.position.x, player.position.z, 1e4).y;
    fall = 0;
    follow();
  } else {
    player.position.set(0, 0, 0);
    grid.position.x = grid.position.z = 0;
    frame(root);
  }
  if (on) setGear('idle'); else play(-1);
}

// Turns a wanted horizontal step into the actual move (step.y included):
// no climbing terrain steeper than MAX_SLOPE, slower uphill, sliding along
// walls, stepping up to STEP onto objects, and falling off edges.
let fall = 0, lastLoad = 0;
function moveInWorld(step, dt) {
  const p = player.position;
  const now = performance.now();
  if (now - lastLoad > 250) {
    lastLoad = now;
    loadNear(p.x, p.z);
    settleNear(p.x, p.z);
    const v = vehicleInReach();
    ui('hint').textContent = v ? `E: get in the ${v.data.name} (${v.data.kind})` : '';
  }
  if (step.lengthSq() > 0) {
    const ahead = floorAt(p.x + step.x, p.z + step.z, p.y);
    if (!ahead.onObject) {
      const n = ahead.normal;
      const slope = Math.acos(Math.min(1, n.y));
      const flat = Math.hypot(n.x, n.z);
      if (flat > 1e-6) {
        // Uphill is against the normal's horizontal part.
        const ux = -n.x / flat, uz = -n.z / flat;
        const up = step.x * ux + step.z * uz;
        if (up > 0 && slope > MAX_SLOPE) { step.x -= ux * up; step.z -= uz * up; }
        else if (up > 0) step.multiplyScalar(1 - 0.5 * Math.sin(slope));
      }
    }
  }
  const next = p.clone().add(step);
  pushOut(next);
  pushOutOfVehicles(next);
  const floor = floorAt(next.x, next.z, p.y);
  if (fall === 0 && floor.y >= p.y - 0.4) {
    // On the ground: follow it up a step or down a slope.
    next.y = floor.y;
  } else {
    fall += 20 * dt;
    next.y = p.y - fall * dt;
    if (next.y <= floor.y) { next.y = floor.y; fall = 0; }
  }
  step.subVectors(next, p);
}

// ---- Vehicles --------------------------------------------------------
// Parked by `gltf world --vehicles`: a node "veh_..." holding the body and
// one "wheel_N" node per wheel, with the driving data (kind, wheels, mass,
// bounds) in its extras. E gets in and out. The handling is a simple
// arcade model TUNED BY HAND, not the game's: top speeds, acceleration,
// grip, steering and the climb limit are guesses. glTF forward is -z.
const vehicles = [];
let driving = null;
const _fwd = new THREE.Vector3(), _left = new THREE.Vector3();

function addVehicle(o) {
  const d = o.userData.vehicle;
  if (!d) return;
  // The loader renames repeated names ("wheel_0_1"), so read the index.
  const index = c => +(/^wheel_(\d+)/.exec(c.name) || [])[1];
  const wheels = o.children.filter(c => Number.isInteger(index(c)))
    .sort((a, b) => index(a) - index(b))
    .map(node => ({ node, base: node.position.clone(), radius: 0.4, steer: false, ...d.wheels[index(node)], spin: 0 }));
  for (const w of wheels) w.node.rotation.order = 'YXZ';
  const rotorIndex = c => +(/^rotor_(\d+)/.exec(c.name) || [])[1];
  const rotors = o.children.filter(c => Number.isInteger(rotorIndex(c)))
    .map(node => ({ node, axis: (d.rotors || [])[rotorIndex(node)]?.axis || [0, 1, 0], spin: 0 }));
  o.rotation.order = 'YXZ';
  // The export mirrors z, so the bounds' z may come swapped.
  const a = new THREE.Vector3(...d.min), b = new THREE.Vector3(...d.max);
  const lo = a.clone().min(b), hi = a.clone().max(b);
  const zs = wheels.map(w => w.base.z);
  vehicles.push({
    root: o, data: d, wheels, rotors, lo, hi, speed: 0, steer: 0, vy: 0, pitch: 0, roll: 0, yaw: o.rotation.y, placed: false,
    wheelbase: zs.length >= 2 ? Math.max(1, Math.max(...zs) - Math.min(...zs)) : Math.max(1, (hi.z - lo.z) * 0.6),
    halfWidth: Math.max(0.4, (hi.x - lo.x) / 2),
    length: Math.max(1, hi.z - lo.z),
  });
}

// Vehicle-local (x, z) to world (x, z), and back, for heading `yaw`.
const toWorld = (v, lx, lz) => {
  const c = Math.cos(v.yaw), s = Math.sin(v.yaw), p = v.root.position;
  return [p.x + lx * c + lz * s, p.z - lx * s + lz * c];
};
const toLocal = (v, wx, wz) => {
  const c = Math.cos(v.yaw), s = Math.sin(v.yaw), dx = wx - v.root.position.x, dz = wz - v.root.position.z;
  return [dx * c - dz * s, dx * s + dz * c];
};

// Puts vehicles within 400 m of (x, z) on the ground, once.
function settleNear(x, z) {
  for (const v of vehicles) {
    const p = v.root.position;
    if (v.placed || Math.hypot(p.x - x, p.z - z) > 400) continue;
    loadNear(p.x, p.z);
    p.y = floorAt(p.x, p.z, terrainAt(p.x, p.z).y + 1).y;
    v.placed = true;
  }
}

// Where a vehicle touches the ground, vehicle-local (x, z): its wheels, or
// the corners of its footprint for tracked ones.
function contacts(v) {
  if (v.wheels.length >= 3 && !v.data.tracked) return v.wheels.map(w => [w.base.x, w.base.z]);
  const x = v.halfWidth * 0.8, z0 = v.lo.z * 0.8, z1 = v.hi.z * 0.8;
  return [[-x, z0], [x, z0], [-x, z1], [x, z1]];
}

// The nearest parked vehicle within reach of the character.
function vehicleInReach() {
  const p = player.position;
  let best = null, bestD = Infinity;
  for (const v of vehicles) {
    const [lx, lz] = toLocal(v, p.x, p.z);
    const dx = Math.max(v.lo.x - lx, 0, lx - v.hi.x), dz = Math.max(v.lo.z - lz, 0, lz - v.hi.z);
    const d = Math.hypot(dx, dz);
    if (d < 2 && d < bestD) { best = v; bestD = d; }
  }
  return best;
}

// ---- Getting in and out ---------------------------------------------
// The game's character clips for each vehicle class come from blocks named
// "vehicleclassanimgroup_<class>" (export the character with them in
// --filter). Clip names are only hashes, so the clips are told apart by
// their root motion, which is relative to the seat: a seated loop stays on
// the seat (the clip origin) throughout; an enter clip starts 0.7 m or more
// beside it, on the driver's (-x) side, and ends on it. Getting out plays
// the enter clip backwards. Clips are placed on the vehicle's driver seat
// marker (see seatFit).
const vehicleAnims = new Map(); // group -> { seat, enter } clip indices
function analyseVehicleClips() {
  vehicleAnims.clear();
  if (!loco) return;
  clips.forEach((c, i) => {
    const group = c.name.split(' ')[0];
    if (!group.startsWith('vehicle')) return;
    const t = c.tracks.find(t => t.name === `${loco.rootName}.position`);
    if (!t) return;
    const a = t.values, n = a.length;
    let far = 0;
    for (let k = 0; k < n; k += 3) far = Math.max(far, Math.hypot(a[k], a[k + 2]));
    const start = Math.hypot(a[0], a[2]), end = Math.hypot(a[n - 3], a[n - 1]);
    const g = vehicleAnims.get(group) || { seat: null, enter: null };
    if (far < 0.05 && c.duration >= 1.5 && (g.seat === null || c.duration > clips[g.seat].duration)) g.seat = i;
    if (start >= 0.7 && end < 0.05 && a[0] < 0 && c.duration >= 0.8
        && (g.enter === null || c.duration < clips[g.enter].duration)) g.enter = i;
    vehicleAnims.set(group, g);
  });
}

// The clip group for a vehicle, by its kind and name.
function animsFor(d) {
  const key = `${d.kind} ${d.name}`;
  for (const [re, cls] of [[/hmmwv/, 'hmmwv'], [/monster/, 'monstertruck'], [/tank/, 'tank'], [/apc/, 'apc'],
    [/semi|bus|m35|mtv/, 'autolargea'], [/truck/, 'truckmid'], [/./, 'automedium']]) {
    if (!re.test(key)) continue;
    const g = vehicleAnims.get(`vehicleclassanimgroup_${cls}`);
    if (g && g.seat !== null && g.enter !== null) return g;
  }
  return null;
}

// Where the rider goes: { theta, q, t } maps clip space into vehicle space.
// The clips share the vehicle's axes with their origin on the driver's
// seat marker (checked by eye on the HMMWV: seated, facing forward, in the
// driver's seat). The door marker is not where the enter clips start (it
// sits mirrored in z from it), so it is not used here.
function seatFit(v) {
  const s = v.data.seat;
  if (!s) return null;
  return { theta: 0, q: new THREE.Quaternion(), t: new THREE.Vector3(s[0], s[1], s[2]) };
}

// Puts the character at its seat in the vehicle.
function placeRider() {
  if (!ride || !ride.fit) return;
  const o = ride.v.root;
  o.updateMatrixWorld(true);
  player.position.copy(ride.fit.t).applyMatrix4(o.matrixWorld);
  player.quaternion.copy(o.quaternion).multiply(ride.fit.q);
}

let ride = null; // { v, anims, fit, phase: 'enter' | 'drive' | 'exit', action }
function playOnce(i, backwards) {
  const a = mixer.clipAction(clips[i]);
  a.reset();
  a.setLoop(THREE.LoopOnce);
  a.clampWhenFinished = true;
  a.timeScale = backwards ? -1 : 1;
  if (backwards) a.time = clips[i].duration;
  return a;
}

function enterOrLeave() {
  if (!world) return;
  if (driving) {
    if (!ride || ride.phase !== 'drive' || Math.abs(driving.speed) > 2) return;
    if (driving.data.flying && !driving.landed) return;
    if (ride.fit) {
      // Climb out: the enter clip, backwards.
      ride.phase = 'exit';
      ride.action = playOnce(ride.anims.enter, true);
      ride.action.crossFadeFrom(current, 0.2, false).play();
      current = ride.action;
    } else leave();
    return;
  }
  const v = vehicleInReach();
  if (!v) return;
  driving = v;
  v.speed = 0;
  const anims = v.data.flying ? null : animsFor(v.data);
  const fit = anims && seatFit(v);
  ride = { v, anims, fit, phase: 'enter', action: null };
  if (fit) {
    mixer.stopAllAction();
    gear = null;
    ride.action = current = playOnce(anims.enter, false);
    current.play();
    placeRider();
  } else {
    // No seat or clips for this vehicle: the character rides out of sight.
    player.visible = false;
    ride.phase = 'drive';
  }
  const p = v.root.position;
  _fwd.set(-Math.sin(v.yaw), 0, -Math.cos(v.yaw));
  controls.target.copy(p).add(new THREE.Vector3(0, 1.5, 0));
  camera.position.copy(p).addScaledVector(_fwd, -(v.length + 5)).add(new THREE.Vector3(0, 3, 0));
}

// Back on foot: where the exit clip ends (its start), or beside the door.
function leave() {
  const v = driving;
  let x, z, yaw = v.yaw;
  if (ride && ride.fit) {
    const c = clips[ride.anims.enter].tracks.find(t => t.name === `${loco.rootName}.position`).values;
    const p = new THREE.Vector3(c[0], 0, c[2]).applyQuaternion(ride.fit.q).add(ride.fit.t);
    v.root.updateMatrixWorld(true);
    p.applyMatrix4(v.root.matrixWorld);
    x = p.x; z = p.z;
    yaw = v.yaw + ride.fit.theta;
  } else [x, z] = toWorld(v, v.data.flying ? -2.5 : v.lo.x - 0.8, 0); // a helicopter's bounds include its rotor
  driving = null;
  ride = null;
  player.position.set(x, 0, z);
  loadNear(x, z);
  player.position.y = floorAt(x, z, v.root.position.y + 1).y;
  player.rotation.set(0, yaw, 0);
  player.visible = true;
  fall = 0;
  mixer.stopAllAction();
  current = null; gear = null; setGear('idle');
  follow();
}

// Moves the getting-in and getting-out clips along.
function stepRide() {
  if (!ride || !ride.action) return;
  const a = ride.action, dur = a.getClip().duration;
  if (ride.phase === 'enter' && a.time >= dur - 1e-3) {
    ride.phase = 'drive';
    const seat = mixer.clipAction(clips[ride.anims.seat]);
    seat.reset().setLoop(THREE.LoopRepeat).play();
    seat.crossFadeFrom(a, 0.2, false);
    current = ride.action = seat;
  } else if (ride.phase === 'exit' && a.time <= 1e-3) leave();
}

// Keeps the character out of parked vehicles (their bounding boxes).
function pushOutOfVehicles(pos) {
  for (const v of vehicles) {
    if (v === driving || Math.hypot(pos.x - v.root.position.x, pos.z - v.root.position.z) > 15) continue;
    if (pos.y > v.root.position.y + v.hi.y) continue;
    let [lx, lz] = toLocal(v, pos.x, pos.z);
    const x0 = v.lo.x - RADIUS, x1 = v.hi.x + RADIUS, z0 = v.lo.z - RADIUS, z1 = v.hi.z + RADIUS;
    if (lx <= x0 || lx >= x1 || lz <= z0 || lz >= z1) continue;
    const m = Math.min(lx - x0, x1 - lx, lz - z0, z1 - lz);
    if (m === lx - x0) lx = x0; else if (m === x1 - lx) lx = x1; else if (m === lz - z0) lz = z0; else lz = z1;
    [pos.x, pos.z] = toWorld(v, lx, lz);
  }
}

function drive(dt) {
  const v = driving, o = v.root, d = v.data;
  const now = performance.now();
  if (now - lastLoad > 250) { lastLoad = now; loadNear(o.position.x, o.position.z); settleNear(o.position.x, o.position.z); }
  // Only the driver, seated, drives.
  const seated = !ride || ride.phase === 'drive';
  const held = k => seated && keys.has(k);
  const throttle = (held('KeyW') ? 1 : 0) - (held('KeyS') ? 1 : 0);
  const steerIn = (held('KeyA') ? 1 : 0) - (held('KeyD') ? 1 : 0);
  // Hand-tuned: top speed (m/s), acceleration and braking (m/s²).
  const top = d.tracked ? 14 : 32, accel = d.tracked ? 4 : 8, brake = 16;
  if (throttle > 0) v.speed += (v.speed < 0 ? brake : accel) * dt;
  else if (throttle < 0) v.speed -= (v.speed > 0 ? brake : accel * 0.6) * dt;
  else v.speed -= Math.sign(v.speed) * Math.min(Math.abs(v.speed), 1.5 * dt);
  if (held('Space')) v.speed -= Math.sign(v.speed) * Math.min(Math.abs(v.speed), 25 * dt);
  // Gravity along the slope.
  v.speed -= 9.8 * Math.sin(v.pitch) * dt;
  v.speed = Math.max(-top * 0.35, Math.min(top, v.speed * (1 - 0.02 * dt)));
  // Steering: a bicycle model for wheels, turning on the spot for tracks.
  const maxSteer = 0.6 / (1 + Math.abs(v.speed) / 12);
  v.steer += (steerIn * maxSteer - v.steer) * Math.min(1, dt * 6);
  const yawRate = d.tracked
    ? steerIn * 1.1 * (v.speed < -0.5 ? -1 : 1)
    : v.speed * Math.tan(v.steer) / v.wheelbase;
  const yaw0 = v.yaw;
  v.yaw += yawRate * dt;
  _fwd.set(-Math.sin(v.yaw), 0, -Math.cos(v.yaw));

  const before = o.position.clone();
  const next = before.clone().addScaledVector(_fwd, v.speed * dt);
  // Walls: spheres along the body, above kerb height, push it out.
  const r = v.halfWidth, n = Math.max(2, Math.ceil(v.length / r));
  const push = new THREE.Vector3();
  for (let i = 0; i < n; i++) {
    const lz = v.lo.z + r + (v.length - 2 * r) * (n === 1 ? 0.5 : i / (n - 1));
    const c = next.clone().addScaledVector(_fwd, -lz).add(push);
    const c0 = c.clone();
    pushOut(c, r, [0.5 + r]);
    push.add(c.sub(c0));
  }
  if (push.lengthSq() > 1e-8) {
    next.add(push);
    // Lose the speed that went into the wall.
    const into = -push.clone().normalize().dot(_fwd) * Math.sign(v.speed);
    if (into > 0) v.speed *= Math.max(0, 1 - 1.5 * into);
  }
  // Ground under each contact; pitch and roll from front/back and left/right.
  const pts = contacts(v);
  let sum = 0, front = 0, back = 0, left = 0, right = 0, nf = 0, nb = 0, nl = 0, nr = 0;
  const posSave = o.position.clone();
  o.position.copy(next);
  for (const [lx, lz] of pts) {
    const [wx, wz] = toWorld(v, lx, lz);
    const h = floorAt(wx, wz, before.y + 0.8).y;
    sum += h;
    if (lz < (v.lo.z + v.hi.z) / 2) { front += h; nf++; } else { back += h; nb++; }
    if (lx < 0) { left += h; nl++; } else { right += h; nr++; }
  }
  o.position.copy(posSave);
  const ground = sum / pts.length;
  const pitch = nf && nb ? Math.atan2(front / nf - back / nb, v.wheelbase) : 0;
  const roll = nl && nr ? Math.atan2(left / nl - right / nr, 2 * v.halfWidth) : 0;
  // Hand-tuned climb limit: about 40 degrees, or a ledge over 0.6 m.
  if ((pitch > 0.7 && v.speed > 0) || (pitch < -0.7 && v.speed < 0) || ground > before.y + 0.6) {
    next.x = before.x; next.z = before.z;
    v.speed *= -0.2;
  } else if (before.y > ground + 0.3 || v.vy > 0) {
    v.vy -= 9.8 * dt;
    next.y = before.y + v.vy * dt;
    if (next.y <= ground) { next.y = ground; v.vy = 0; }
  } else {
    next.y = ground;
    v.vy = 0;
  }
  v.pitch += (pitch - v.pitch) * Math.min(1, dt * 8);
  v.roll += (roll - v.roll) * Math.min(1, dt * 8);
  o.position.copy(next);
  o.rotation.set(v.pitch, v.yaw, -v.roll);
  // Wheels roll and the front ones steer.
  for (const w of v.wheels) {
    w.spin += v.speed * dt / w.radius;
    w.node.rotation.set(-w.spin, w.steer ? v.steer : 0, 0);
  }
  if (!rideAlong(v, before, yaw0)) return;
  ui('hint').textContent = `${d.name} (${d.kind}) · ${Math.round(Math.abs(v.speed) * 3.6)} km/h · W/S drive, A/D steer, Space brake, E get out`;
}

// The character rides along; the camera follows and turns with the
// vehicle. False once the character has got out.
function rideAlong(v, before, yaw0) {
  const o = v.root;
  if (ride && ride.fit) placeRider(); else player.position.copy(o.position);
  stepRide();
  if (!driving) return false;
  const delta = o.position.clone().sub(before);
  camera.position.add(delta);
  controls.target.add(delta);
  const off = camera.position.clone().sub(controls.target).applyAxisAngle(_up, v.yaw - yaw0);
  camera.position.copy(controls.target).add(off);
  return true;
}

// Helicopters. An arcade model TUNED BY HAND, not the game's: the rotor
// spins up for 2.5 s before it lifts; Space climbs and Shift descends at up
// to 8 m/s, W/S push the nose down or up to fly forward or back (to about
// 45 m/s), A/D turn. The fuselage is a row of 1.5 m spheres against the
// collision; it lands on whatever is under its skids.
const _axis = new THREE.Vector3();
function fly(dt) {
  const v = driving, o = v.root, d = v.data;
  const now = performance.now();
  if (now - lastLoad > 250) { lastLoad = now; loadNear(o.position.x, o.position.z); settleNear(o.position.x, o.position.z); }
  const seated = !ride || ride.phase === 'drive';
  const held = k => seated && keys.has(k);
  const ahead = (held('KeyW') ? 1 : 0) - (held('KeyS') ? 1 : 0);
  const turn = (held('KeyA') ? 1 : 0) - (held('KeyD') ? 1 : 0);
  const lift = (held('Space') ? 1 : 0) - (held('ShiftLeft') || held('ShiftRight') ? 1 : 0);
  v.rpm = Math.min(1, (v.rpm || 0) + (seated ? dt / 2.5 : 0));
  v.vel = v.vel || new THREE.Vector3();
  const before = o.position.clone(), yaw0 = v.yaw;
  const ground0 = floorAt(before.x, before.z, before.y + 0.5).y;
  v.landed = before.y <= ground0 + 0.05;
  const flying = v.rpm > 0.8 && (!v.landed || lift > 0);
  if (flying) v.yaw += turn * 1.1 * dt;
  _fwd.set(-Math.sin(v.yaw), 0, -Math.cos(v.yaw));
  if (flying) v.vel.addScaledVector(_fwd, ahead * 9 * dt);
  const drag = Math.exp(-(v.landed ? 3 : 0.6) * dt);
  v.vel.x *= drag; v.vel.z *= drag;
  const flat = Math.hypot(v.vel.x, v.vel.z);
  if (flat > 45) { v.vel.x *= 45 / flat; v.vel.z *= 45 / flat; }
  // Climb, sink or hover; without lift it falls.
  const wantVy = v.rpm > 0.8 ? lift * 8 : -20;
  v.vel.y += (wantVy - v.vel.y) * Math.min(1, dt * (v.rpm > 0.8 ? 2 : 1));
  const next = before.clone().addScaledVector(v.vel, dt);
  // Buildings and hills: spheres along the fuselage.
  const push = new THREE.Vector3();
  for (let i = 0; i < 4; i++) {
    const lz = v.lo.z * 0.4 + (v.hi.z * 0.3 - v.lo.z * 0.4) * (i / 3);
    const c = next.clone().addScaledVector(_fwd, -lz).add(push);
    const c0 = c.clone();
    pushOut(c, 1.5, [1.6]);
    push.add(c.sub(c0));
  }
  if (push.lengthSq() > 1e-8) {
    next.add(push);
    const n = push.clone().normalize();
    const into = v.vel.dot(n);
    if (into < 0) v.vel.addScaledVector(n, -into);
  }
  const ground = floorAt(next.x, next.z, Math.max(before.y, next.y) + 0.5).y;
  if (next.y <= ground) {
    next.y = ground;
    if (v.vel.y < 0) v.vel.y = 0;
  }
  // Lean into the motion.
  const fwdSpeed = v.vel.dot(_fwd);
  const pitch = v.landed ? 0 : -0.012 * fwdSpeed - 0.08 * ahead;
  const roll = v.landed ? 0 : 0.25 * turn;
  v.pitch += (pitch - v.pitch) * Math.min(1, dt * 3);
  v.roll += (roll - v.roll) * Math.min(1, dt * 3);
  o.position.copy(next);
  o.rotation.set(v.pitch, v.yaw, -v.roll);
  for (const r of v.rotors) {
    r.spin += v.rpm * 30 * dt;
    r.node.quaternion.setFromAxisAngle(_axis.set(...r.axis), r.spin);
  }
  v.speed = flat;
  if (!rideAlong(v, before, yaw0)) return;
  const height = next.y - ground;
  ui('hint').textContent = v.rpm < 0.8
    ? `${d.name} · rotor spinning up…`
    : `${d.name} · ${Math.round(flat * 3.6)} km/h · ${Math.round(height)} m up · Space up, Shift down, W/S forward/back, A/D turn${v.landed ? ', E get out' : ''}`;
}

function stepPlay(dt) {
  dt = Math.min(dt, 0.05);
  if (driving) { if (driving.data.flying) fly(dt); else drive(dt); return; }
  const ahead = new THREE.Vector3();
  camera.getWorldDirection(ahead);
  const fwd = new THREE.Vector2(ahead.x, ahead.z).normalize();
  const right = new THREE.Vector2(-fwd.y, fwd.x);
  const move = new THREE.Vector2();
  if (keys.has('KeyW')) move.add(fwd);
  if (keys.has('KeyS')) move.sub(fwd);
  if (keys.has('KeyD')) move.add(right);
  if (keys.has('KeyA')) move.sub(right);
  const step = new THREE.Vector3();
  if (move.lengthSq() === 0) setGear('idle');
  else {
    move.normalize();
    setGear(keys.has('ShiftLeft') || keys.has('ShiftRight') ? 'sprint' : walking ? 'walk' : 'run');
    // Turn the character's forward towards the move, smoothly.
    const want = Math.atan2(move.x, move.y) - Math.atan2(loco.fwd.x, loco.fwd.y);
    let d = want - player.rotation.y;
    d = Math.atan2(Math.sin(d), Math.cos(d));
    player.rotation.y += d * Math.min(1, dt * 10);
    const speed = loco.info[+ui(gear).value].speed;
    step.set(move.x, 0, move.y).multiplyScalar(speed * dt);
  }
  if (world) moveInWorld(step, dt);
  else if (step.lengthSq() === 0) return;
  player.position.add(step);
  camera.position.add(step);
  controls.target.add(step);
  grid.position.x = Math.round(player.position.x);
  grid.position.z = Math.round(player.position.z);
}

addEventListener('keydown', e => {
  if (!ui('playmode').checked || e.target.tagName === 'SELECT') return;
  if (e.code === 'KeyQ') walking = !walking;
  if (e.code === 'KeyE' && !e.repeat) enterOrLeave();
  if (e.code === 'Space') e.preventDefault();
  keys.add(e.code);
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
ui('playmode').onchange = e => { startPlay(e.target.checked); e.target.blur(); };
ui('showcol').onchange = e => {
  for (const c of colliders) if (c.source === 'phy2') c.src.traverse(m => { if (m.isMesh) m.visible = e.target.checked; });
  e.target.blur();
};
for (const g of gears) ui(g).onchange = e => { if (gear === g) { gear = null; setGear(g); } e.target.blur(); };

function open(gltf, name) {
  if (root) player.remove(root);
  if (skeleton) scene.remove(skeleton);
  root = gltf.scene;
  player.add(root);
  rest = [];
  root.traverse(o => rest.push([o, o.position.clone(), o.quaternion.clone(), o.scale.clone()]));
  skeleton = new THREE.SkeletonHelper(root);
  skeleton.visible = ui('skel').checked;
  scene.add(skeleton);
  mixer = new THREE.AnimationMixer(root);
  clips = gltf.animations;
  const sel = ui('anim');
  sel.innerHTML = '';
  sel.add(new Option('(rest pose)', -1));
  clips.forEach((c, i) => sel.add(new Option(`${c.name}  (${c.duration.toFixed(2)}s)`, i)));
  ui('name').textContent = name;
  frame(root);
  // For inspecting from the browser console.
  window.viewer = { root, mixer, clips, play, THREE, camera, controls, player, groundAt, floorAt, colliders, loadNear, pushOut,
    vehicles, enterOrLeave, stepPlay, keys, vehicleAnims, get ride() { return ride; }, get driving() { return driving; }, get triCount() { return triCount; }, get loco() { return loco; }, get world() { return world; } };
  let meshes = 0; root.traverse(o => { if (o.isMesh) meshes++; });
  status(`${meshes} mesh primitives, ${clips.length} animations`);
  player.position.set(0, 0, 0);
  player.rotation.set(0, 0, 0);
  ui('playmode').checked = false;
  loco = analyse(gltf);
  ui('playpanel').style.display = loco && fillGears() ? '' : 'none';
  analyseVehicleClips();
  play(-1);
}

const loader = new GLTFLoader();
function load(url, name) {
  status('Loading…');
  loader.load(url, g => open(g, name), undefined, e => status('Failed to load: ' + e.message));
}
function loadBuffer(buf, name) {
  loader.parse(buf, '', g => open(g, name), e => status('Failed to parse: ' + e.message));
}

ui('anim').onchange = e => {
  const i = +e.target.value;
  if (ui('playmode').checked) { ui('playmode').checked = false; startPlay(false); }
  play(i);
};
ui('play').onclick = () => { playing = !playing; if (action) action.paused = !playing; ui('play').textContent = playing ? 'Pause' : 'Play'; };
ui('prev').onclick = () => play((+ui('anim').value - 1 + clips.length) % clips.length);
ui('next').onclick = () => play((+ui('anim').value + 1) % clips.length);
ui('skel').onchange = e => { if (skeleton) skeleton.visible = e.target.checked; };
ui('speed').oninput = e => { speed = +e.target.value; ui('speedv').textContent = speed.toFixed(1); };
ui('time').oninput = e => { if (action) { action.time = +e.target.value; mixer.update(0); } };

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
addEventListener('dragover', e => { e.preventDefault(); ui('drop').style.display = 'flex'; });
addEventListener('dragleave', () => ui('drop').style.display = 'none');
addEventListener('drop', async e => {
  e.preventDefault(); ui('drop').style.display = 'none';
  const f = e.dataTransfer.files[0];
  if (f) loadBuffer(await f.arrayBuffer(), f.name);
});

renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (mixer && ui('playmode').checked) { stepPlay(dt); mixer.update(dt); }
  else if (mixer && playing) mixer.update(dt * speed);
  if (action) { ui('time').value = action.time; ui('timev').textContent = action.time.toFixed(2) + 's'; }
  if (world) cullObjects(false);
  controls.update();
  renderer.render(scene, camera);
});

load('model.glb', new URLSearchParams(location.search).get('name') || 'model.glb');
// The world is optional: the server only has one with `view --world`.
fetch('world.glb').then(r => r.ok ? r.arrayBuffer() : null).then(buf => {
  if (buf) loader.parse(buf, '', openWorld, e => status('World failed to parse: ' + e.message));
});
</script>
</body>
</html>
