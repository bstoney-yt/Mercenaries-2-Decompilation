[package]
name = "m2-launcher"
description = "The launcher: picks a save and starts m2-alpha, drawn with the game's own art and fonts from the player's install."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "m2-launcher"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts"] }
egui.workspace = true
m2-assets.workspace = true
m2-engine.workspace = true
miniz_oxide.workspace = true
png = "0.18"
serde.workspace = true
toml.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }

[lints]
workspace = true

[features]
# The play builds: no console window opens with it.
windowed = []
