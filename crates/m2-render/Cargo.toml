[package]
name = "m2-render"
description = "Rendering abstraction over the original Direct3D 9 calls."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
## The GPU backend (Direct3D 12, Vulkan or Metal through wgpu).
wgpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
## wgpu's no-GPU backend, for timing the CPU side of a frame with
## `WGPU_BACKEND=noop WGPU_NOOP_BACKEND=1` (see `docs/profiling.md`).
noop = ["wgpu", "wgpu/noop"]

[dependencies]
m2-math.workspace = true
thiserror.workspace = true
bytemuck = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }

[lints]
workspace = true
