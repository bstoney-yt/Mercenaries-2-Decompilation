[package]
name = "m2-alpha"
description = "The native game: plays the island from the player's own install."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "m2-alpha"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bytemuck.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
m2-assets.workspace = true
m2-engine.workspace = true
m2-game.workspace = true
m2-math.workspace = true
m2-render = { workspace = true, features = ["wgpu"] }
m2-sys.workspace = true
mlua.workspace = true
serde.workspace = true
toml.workspace = true
winit = { workspace = true, features = ["serde"] }

# Sound output. Windows and Android only for now: elsewhere cpal needs the
# system's ALSA development files, and the game is played on Windows.
[target.'cfg(windows)'.dependencies]
cpal = "0.18"

# The Android build (built from android/, its own workspace; see
# android/README.md).
[target.'cfg(target_os = "android")'.dependencies]
cpal = "0.18"
jni = "0.21"
libc = "0.2"
ndk-context = "0.1"
winit = { workspace = true, features = ["serde", "android-native-activity"] }

[lints]
workspace = true
