[package]
name = "m2-alpha"
description = "The native game: plays the island from the player's own install."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "m2-alpha"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
m2-assets.workspace = true
m2-engine.workspace = true
m2-math.workspace = true
m2-render = { workspace = true, features = ["wgpu"] }
serde.workspace = true
toml.workspace = true
winit = { workspace = true, features = ["serde"] }

# Sound output. Windows only for now: elsewhere cpal needs the system's
# ALSA development files, and the game is played on Windows.
[target.'cfg(windows)'.dependencies]
cpal = "0.18"

[lints]
workspace = true
