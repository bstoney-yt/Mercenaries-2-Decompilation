[package]
name = "m2-alpha"
description = "The native game: plays the island from the player's own install."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "m2-alpha"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bytemuck.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
m2-assets.workspace = true
m2-engine.workspace = true
m2-game.workspace = true
m2-math.workspace = true
m2-net.workspace = true
m2-render = { workspace = true, features = ["wgpu"] }
m2-sys.workspace = true
mlua.workspace = true
profiling = { version = "1", features = ["profile-with-tracy"], optional = true }
serde.workspace = true
toml.workspace = true
# ondemand: nothing is recorded (or kept in memory) until a profiler connects.
# timer-fallback: without an invariant TSC (a VM) the client would end the
# game at start; with it the client falls back to a slower timer.
tracy-client = { version = "0.18", features = ["ondemand", "timer-fallback"], optional = true }
winit = { workspace = true, features = ["serde"] }

# Sound output. Windows and Android only for now: elsewhere cpal needs the
# system's ALSA development files, and the game is played on Windows.
[target.'cfg(windows)'.dependencies]
cpal = "0.18"

# The Android build (built from android/, its own workspace; see
# android/README.md).
[target.'cfg(target_os = "android")'.dependencies]
cpal = "0.18"
jni = "0.21"
libc = "0.2"
mimalloc = { version = "0.1", default-features = false }
ndk-context = "0.1"
winit = { workspace = true, features = ["serde", "android-native-activity"] }

[lints]
workspace = true

# Off by default. `--features tracy` sends the pace spans (src/spans.rs) and
# wgpu's and egui's own scopes to a Tracy profiler; see docs/profiling.md.
[features]
tracy = ["dep:tracy-client", "dep:profiling"]
