name: CI

# GitHub Free gives this private repo 2,000 Actions minutes a month and
# Windows minutes count double, so the Windows build only runs on main and
# on PRs marked ready for review; drafts get the Linux job alone.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'

# A new push to a PR cancels the run it supersedes; runs on main finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  host:
    name: Lint and test (Linux host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml installs the pinned toolchain and the i686 target.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo xtask symbols

  windows-i686:
    name: Build (i686-pc-windows-msvc)
    runs-on: windows-latest
    if: github.event_name == 'push' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # Lints the Windows target here, where the C parts (the vendored Lua
      # in m2-game) can be compiled.
      - run: cargo clippy --workspace --all-targets --target i686-pc-windows-msvc
      - run: cargo build --workspace --target i686-pc-windows-msvc
      # The script host's Lua raises errors with longjmp, which unwinds
      # differently on Windows; run its tests there on both targets.
      - run: cargo test -p m2-game
      - run: cargo test -p m2-game --target i686-pc-windows-msvc
      - name: Build the alpha exe
        run: cargo build --release -p m2-alpha --target i686-pc-windows-msvc
      # Our code only: the exe reads the game from the player's own install.
      - uses: actions/upload-artifact@v4
        with:
          name: m2-alpha-windows-i686
          path: target/i686-pc-windows-msvc/release/m2-alpha.exe
