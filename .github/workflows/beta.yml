name: Beta release

# Publishes the beta (the alpha's exe, which plays co-op) as a GitHub
# Release, the download the co-op join page links to
# (releases/latest/download/m2-beta-windows.zip). Run by pushing a tag
# named beta-<something>, or by hand from the Actions tab.
#
# Our code only: the exe reads every game file from the player's own
# install, and nothing of the game's is packed.
on:
  push:
    tags: ['beta-*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (beta-YYYYMMDD...)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the beta
    runs-on: [self-hosted, Windows, X64, m2-pc]
    env:
      CARGO_TERM_COLOR: always
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo build --release -p m2-alpha --target i686-pc-windows-msvc
      # The runner's service account may not run PowerShell scripts (its
      # execution policy), so these steps run in cmd. cmd carries on past a
      # failed line, so each one exits on failure. The zip is made by the
      # tar that ships with Windows.
      - name: Pack
        shell: cmd
        run: |
          if exist target\beta rmdir /s /q target\beta || exit /b 1
          mkdir target\beta || exit /b 1
          copy /y target\i686-pc-windows-msvc\release\m2-alpha.exe target\beta\m2-beta.exe || exit /b 1
          > target\beta\README.txt echo Mercenaries 2 beta (%TAG%)|| exit /b 1
          type .github\beta\README.txt >> target\beta\README.txt || exit /b 1
          if exist target\m2-beta-windows.zip del target\m2-beta-windows.zip || exit /b 1
          tar -a -c -f target\m2-beta-windows.zip -C target\beta m2-beta.exe README.txt || exit /b 1
      - name: Publish
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "%TAG%" target\m2-beta-windows.zip --repo ${{ github.repository }} --target ${{ github.sha }} --title "Beta %TAG%" --notes "Co-op beta. Needs your own install of Mercenaries 2 (PC). Download m2-beta-windows.zip, unzip, run m2-beta.exe."
